var Class = function(){

	var cache = {};

	var create = function( fn, methods, parent ){

		var _initialize, _instances = [], instance, _unique = 0;

		_initialize = function( args ){
			fn.apply( this, args );
		}

		if ( parent ){
			_initialize.prototype = parent;
		}

		for ( var i in methods ){
			_initialize.prototype[ i ] = 	methods[ i ];
		}

		_initialize.prototype.implement = function(){
			var fns = arguments[0].split('.'), args = Array.prototype.slice.call( arguments, 1 ), fn = this;
			for ( var i = 0, c; c = fns[i++]; ){
				fn = fn[ c ];
				if ( !fn ){
					return alert ('�ӿ���δʵ��');
				}
			}
			return fn.apply( this, args );
		}

		var getInstance = function(){
			var args = Array.prototype.slice.call( arguments, 0 );
			 _instances[ _unique++ ] = new _initialize( args );
			return _instances[ _unique - 1 ];
		}

		var empty = function(){
			for ( var i = 0, c; c = _instances[i++]; ){
				c = null;
			}
			_instances = [];
			_instances.length = 0;
			_unique = 0;
		}

		var getCount = function(){
			return _unique;
		}

		var getPrototype = function(){
			return _initialize.prototype;
		}

		var subClass = function( fn, methods ){
			var a = Class.create( fn, methods, _instances[0] || getInstance() );
			return a
		}

		var interface = function( key, fn ){
			if ( _initialize ){
				_initialize.prototype[ key ] = fn;
			}
		}

		return {
			interface: interface,
			getInstance: getInstance,
			empty: empty,
			getCount: getCount,
			getPrototype: getPrototype,
			subClass: subClass,
		}

	}

	return {
		create: create,
		getInstances: function(){
			return _instances;	
		}
	}
	
	
}()

	<script> 
	var Timer = function(){

		var t, timers = [], curr, prepareTimer = [], slowTimer = 1, index = 0;
		
		var getSlow = function(){
			return Config.fps * slowTimer;	
		}
		
		var start = function(){
			if ( t ) return;
			t = setInterval( function(){
				if ( slowTimer !== 1 ){
					if ( index++ % slowTimer !== 0 ){
						return;
					}
				}
				timers = prepareTimer.concat( timers );
				prepareTimer.length = 0;
				for ( curr = timers.length - 1; curr >= 0; curr-- ){
					if ( timers[ curr ].state === 'stop' ){
						continue;
					}
					timers[ curr ]();
					//if ( timers[ curr ].state === 'stop' ){
						//timers[ curr ].state = 'destory';
						//timers.splice( curr, 1 );
					//}
				}
			
			}, Config.fps * slowTimer );
		}

		var clean = function(){
			for ( ; curr >= 0; curr-- ){
				if ( timers[ curr ]() === 'done' ){
					timers.splice( i, 1 );
				}
			}
		}

		var push = function( fn ){
			timers[ timers.length ] = fn;
			return fn;
		}

		var unshift = function( fn ){
			return prepareTimer.unshift( fn );  //����ͬ��, ��Ȼ���ܻ����A���ӽ���timer�� ��Bû��. �û�����Զ���ֿ�.
		}
		
		var checkZindex = function( fn ){
			var j, k, oldFn;
			for ( var i = 0, c; c = timers[ i++ ]; ){
				if ( c === fn ){
					j =  i - 1;	
				}else if ( c.zIndex ){
					k = i - 1;
					oldFn = c;
				}
			}
			if ( j > k ){
				timers[ j ] = oldFn;
				timers[ k ] = fn;	
			}
		}

		var stop = function(){
			clean();
			clearInterval( t );
			t = null;
		}

		var empty = function(){
			timers.length = 0;
			//stop();
		}
		
		var slow = function( timer ){
			stop()
			slowTimer = 3;
			start();
			setTimeout( function(){
				stop();
				slowTimer = 1;
				start();
			}, timer )
		}
		
		var normal = function(){

		return {
			start: start,
			stop: stop
		}
	
	}

		return {
			add: add,
			start: start,
			push: push,
			unshift: unshift,
			stop: stop,

		},

		enemyBeat: function(){
	
				if ( this.master.state === 'jump_whirl_kick' || this.master.state === 'jump_light_whirl_kick' ){
					if ( this.master.enemy.statusManage.isCrouch() ){
						return;

				this.attackEffect.start( this.easing[ 4 ], this.master.direction === 1 ? this.master.enemy.left + this.effect_position[ 0 ] : this.master.enemy.left + this.master.enemy.width + this.effect_position[ 0 ] , this.master.enemy.top + this.effect_position[ 1 ] );

				var attack_light = this.master.statusManage.get().attack_light;

				if ( !this.master.statusManage.isCrouch() && this.master.enemy.statusManage.isJump() && this.master.state !== 'jump_whirl_kick' && this.master.state !== 'jump_light_whirl_kick' && this.master.state !== 'jump_heavy_impact_boxing' && this.master.state !== 'jump_light_impact_boxing' ){
					this.master.enemy.play( 'jump_fall_down' );

				else{

				}


				if ( this.master.enemy.border && !this.master.statusManage.isJump() ){
					this.master.animate.start( ( attack_light ? -70 : -150 ) * this.master.direction, 0, 300, 'linear' );		
				}

				this.master.enemy.waveBoxing.ready_firing = false;
				
				this.playAudio( null, 1 );

				//this.master.enemy.attack.stop();

				this.stop();

		},

		start: function( left, top, easing, effect_position, sound ){
			if ( this.master.direction === 1 ){
				this.left = this.master.left + left;
			}else{
				this.left = this.master.left + this.master.width * 2 - left - this.width * 2;
			}
			this.top = this.master.top + top;
			this.effect_position = effect_position;
			this.animate.start( easing[0], easing[1], easing[2], easing[3] );
			this.easing = easing;
			this.sound = sound;
			this.timer.start();
		},

			var self = this;
			this.easing = easing;
			this.effect_position = effect_position;
			this.sound = sound;
			this.width = this.height = easing[ 2 ];
			this.animate_type = 'stick';
			this.timer.start();
			this.playAudio( this.sound[ 0 ] )
		},

		stop: function(){
			this.animate_type = 'normal';
			this.timer.stop();
			this.master.statusManage.set_attack_power( [ 0, false ] );  //����֮��ȡ���޵�״̬
			this.playAudio( null, 0 );
		},

		playAudio: function( src, type ){

			if ( src ){
				return this.audio.play( src );
			}

			if ( !this.sound ) return;

			if ( type === 1 ){
				return this.master.enemy.attack.audio.play( this.sound[ 1 ] );	
			}else if ( type === 0 ){
				if ( this.master.statusManage.isJump() ) return;
				var enemy_attack_type = this.master.enemy.statusManage.get().attack_type;

			var maxX =  Map.getMaxX();
			if ( left < 15 || left > maxX - this.width - 20 ){
				this.stop();
			}
			return left;
		}
